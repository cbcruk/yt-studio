<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yt-dlp 스튜디오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#EBEEE9;
    --panel:#F5F7F3;
    --ink:#141C19;
    --dim:#69756F;
    --rule:#CBD2CB;
    --signal:#4B2ED4;
    --signal-wash:#4B2ED414;
    --set:#137A57;
    --set-wash:#137A5714;
    --warn:#B02E1F;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --display:"Space Grotesk",var(--mono);
    --node-w:300px;
    --head-h:34px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font:400 13px/1.55 var(--mono);
    display:flex; flex-direction:column; overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  button,input,select,textarea{font:inherit;color:inherit}
  ::selection{background:var(--signal);color:#fff}

  /* ── header ─────────────────────────────── */
  .top{
    border-bottom:1px solid var(--rule); background:var(--panel);
    padding:12px 18px; display:flex; flex-wrap:wrap; gap:14px; align-items:center;
    flex:none; position:relative; z-index:40;
  }
  .wordmark{font:700 19px/1 var(--display);letter-spacing:-.02em;white-space:nowrap}
  .wordmark em{font-style:normal;color:var(--signal)}
  .ver{color:var(--dim);font-size:11px;letter-spacing:.04em;margin-top:3px}
  .top-spacer{flex:1}
  .topact{display:flex;gap:8px;flex-wrap:wrap}

  /* 서브그래프 브레드크럼 */
  .crumb{display:flex;align-items:center;gap:8px;font-size:12px}
  .crumb[hidden]{display:none}
  .crumb .sep{color:var(--dim)}
  .crumb .here{font:500 13px/1 var(--display);color:var(--fmt,#6E7A12)}
  .crumb .back{
    border:1px solid var(--rule);background:transparent;border-radius:3px;
    padding:4px 9px;cursor:pointer;white-space:nowrap;
  }
  .crumb .back:hover{border-color:var(--signal);color:var(--signal)}

  .field{position:relative;display:flex;align-items:center;gap:8px;flex:1 1 300px;min-width:220px}
  .field[hidden]{display:none}
  .field label{color:var(--dim);font-size:11px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
  .field input{
    flex:1;background:var(--ground);border:1px solid var(--rule);border-radius:3px;
    padding:6px 9px;min-width:0;
  }
  .field input:focus-visible{outline:2px solid var(--signal);outline-offset:1px;border-color:transparent}

  .btn{
    background:transparent;border:1px solid var(--rule);border-radius:3px;
    padding:6px 11px;cursor:pointer;white-space:nowrap;
    transition:border-color .12s,color .12s,background .12s;
  }
  .btn:hover{border-color:var(--signal);color:var(--signal)}
  .btn:focus-visible{outline:2px solid var(--signal);outline-offset:1px}
  .btn.primary{background:var(--ink);color:var(--ground);border-color:var(--ink)}
  .btn.primary:hover{background:var(--signal);border-color:var(--signal);color:#fff}

  /* ── search overlay ─────────────────────── */
  .hits{
    position:absolute; top:calc(100% + 6px); left:0; width:min(560px,90vw);
    background:var(--panel); border:1px solid var(--ink); border-radius:4px;
    box-shadow:0 14px 34px #141c1922; max-height:56vh; overflow-y:auto; z-index:60;
  }
  .hits[hidden]{display:none}
  .hits-head{padding:8px 12px;color:var(--dim);font-size:11px;border-bottom:1px solid var(--rule);
    position:sticky;top:0;background:var(--panel)}
  .hit{
    display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
    width:100%;text-align:left;border:0;background:none;border-bottom:1px solid var(--rule);
    padding:8px 12px;cursor:pointer;
  }
  .hit:hover,.hit:focus-visible{background:var(--signal-wash);outline:none}
  .hit-flag{font-weight:600;word-break:break-all}
  .hit-flag .short{color:var(--signal);font-weight:500}
  .hit-help{color:var(--dim);font-size:11px;margin-top:2px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .hit mark{background:#F0D97B;color:var(--ink);padding:0 1px}
  .hit-stage{font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    border:1px solid currentColor;border-radius:9px;padding:1px 7px;white-space:nowrap}
  .hit-on{color:var(--set);font-size:11px;white-space:nowrap}

  /* ── main split ─────────────────────────── */
  .main{flex:1;display:flex;min-height:0}

  /* palette */
  .palette{
    width:196px;flex:none;border-right:1px solid var(--rule);background:var(--panel);
    padding:12px 0 18px;overflow-y:auto;
  }
  .pal-head{padding:0 14px 8px;color:var(--dim);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
  .pal-hint{padding:0 14px 12px;color:var(--dim);font-size:11px;line-height:1.5}
  .pal-hint b{color:var(--ink);font-weight:500}
  .pal-item{
    display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:7px;
    width:100%;text-align:left;border:0;background:none;padding:6px 14px;cursor:grab;
    color:var(--dim);position:relative;touch-action:none;
  }
  .pal-item .dot{width:7px;height:7px;border-radius:2px;background:var(--a)}
  .pal-item .tag{color:var(--ink)}
  .pal-item .tag b{font-weight:500}
  .pal-item .ko{font:500 12px/1 var(--display);margin-left:5px}
  .pal-item:hover{background:var(--ground)}
  .pal-item:focus-visible{outline:2px solid var(--signal);outline-offset:-2px}
  .pal-item .n{font-size:11px;color:var(--set);background:var(--set-wash);border-radius:9px;padding:1px 6px}
  .pal-item.placed{opacity:.45;cursor:default}
  .pal-item.placed:hover{background:none}
  .pal-sep{border:0;border-top:1px solid var(--rule);margin:12px 14px}
  .pal-act{display:flex;flex-direction:column;gap:6px;padding:0 14px}
  .pal-act .btn{width:100%}

  .pal-ghost{
    position:fixed;z-index:99;pointer-events:none;background:var(--panel);
    border:1px solid var(--a);border-left:3px solid var(--a);border-radius:4px;
    padding:6px 10px;box-shadow:0 8px 22px #141c1926;font-size:12px;
  }

  /* ── canvas ─────────────────────────────── */
  .viewport{
    flex:1;position:relative;overflow:hidden;min-width:0;touch-action:none;
    background:radial-gradient(circle at 1px 1px, var(--rule) 1px, transparent 0);
    background-size:22px 22px;
    cursor:grab;
  }
  .viewport.panning{cursor:grabbing}
  .viewport.wiring{cursor:crosshair}
  /* 서브그래프 안이라는 걸 캔버스 자체가 말해 준다 */
  .viewport.sub{background-color:#F1F0E6}
  .wires{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
  .wire-hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
  .wire{fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
  .wire.dead{stroke:var(--rule);stroke-dasharray:5 5}
  .wire-g:hover .wire{stroke:var(--warn);stroke-width:3}
  .wire-temp{fill:none;stroke:var(--signal);stroke-width:2;stroke-dasharray:5 4}
  .wire-ord{font:500 10px var(--mono);fill:var(--dim);pointer-events:none}

  /* 레이어 자체는 클릭을 통과시킨다 — 아래 깔린 와이어를 집을 수 있어야 한다. */
  .nodes{position:absolute;inset:0;transform-origin:0 0;pointer-events:none}
  .node{
    pointer-events:auto;
    position:absolute;width:var(--node-w);background:var(--panel);
    border:1px solid var(--rule);border-radius:5px;
    box-shadow:0 2px 0 #141c190a, 0 10px 24px #141c1910;
  }
  /* 경로에서 끊긴 노드는 흐리게. 소스·명령어 노드는 계속 만져야 하므로 테두리만 바꾼다. */
  .node.bypass{border-style:dashed}
  .node.bypass:not(.io){opacity:.5}
  .node.sel{border-color:var(--a);box-shadow:0 0 0 2px color-mix(in srgb,var(--a) 30%,transparent),0 10px 24px #141c1914}
  .node.lit{box-shadow:0 0 0 2px var(--signal),0 10px 24px #141c1914}
  .node.collapsed .node-head{border-bottom:0;border-radius:4px}
  .node-head{
    height:var(--head-h);display:grid;grid-template-columns:auto 1fr auto auto auto;
    align-items:center;gap:7px;padding:0 8px 0 10px;cursor:grab;
    border-bottom:1px solid var(--rule);border-left:3px solid var(--a);
    border-radius:4px 4px 0 0;background:var(--ground);user-select:none;
  }
  .node-head:active{cursor:grabbing}
  .node-tag{color:var(--a);font-weight:600}
  .node-ko{font:500 12px/1 var(--display);color:var(--ink)}
  .node-n{font-size:11px;color:var(--set);background:var(--set-wash);border-radius:9px;padding:1px 6px}
  .node-n[data-n="0"]{visibility:hidden}
  .node-x{border:0;background:none;color:var(--dim);cursor:pointer;padding:2px 4px;line-height:1;border-radius:3px}
  .node-x:hover{color:var(--warn);background:#B02E1F14}
  .node-body{padding:6px 8px 8px;max-height:340px;overflow-y:auto}
  .node-note{color:var(--dim);font-size:11px;padding:4px 2px 6px;line-height:1.5}
  .node-badge{
    display:inline-block;margin-left:2px;font-size:10px;letter-spacing:.08em;
    color:var(--warn);border:1px solid var(--warn);border-radius:9px;padding:0 6px;
  }
  .node:not(.bypass) .node-badge{display:none}

  .port{
    position:absolute;width:13px;height:13px;border-radius:50%;
    background:var(--panel);border:2px solid var(--a);cursor:crosshair;z-index:3;
    top:calc(var(--head-h)/2);
  }
  .port.in{left:-7px;transform:translateY(-50%)}
  .port.out{right:-7px;transform:translateY(-50%)}
  .port:hover,.port.hot{background:var(--a);transform:translateY(-50%) scale(1.3)}

  /* 파이프라인 노드 안의 옵션 행 */
  .row{border-top:1px solid var(--rule);padding:7px 2px 8px}
  .row:first-child{border-top:0}
  .row.lit{background:var(--signal-wash);box-shadow:inset 3px 0 0 var(--signal)}
  .row-top{display:flex;align-items:baseline;gap:6px}
  .row-flag{font-weight:600;word-break:break-all;flex:1;min-width:0}
  .row-flag .short{color:var(--signal);font-weight:500}
  .row-x{border:0;background:none;color:var(--dim);cursor:pointer;padding:0 3px;line-height:1;border-radius:3px}
  .row-x:hover{color:var(--warn);background:#B02E1F14}
  .row-sub{
    border:1px solid var(--rule);background:var(--ground);border-radius:3px;
    padding:1px 7px;font-size:11px;color:var(--dim);cursor:pointer;white-space:nowrap;
  }
  .row-sub:hover{border-color:#6E7A12;color:#6E7A12}
  .row-help{color:var(--dim);font-size:11px;margin:2px 0 5px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .row-ctl input[type=text],.row-ctl select,.row-ctl textarea{
    width:100%;background:var(--ground);border:1px solid var(--rule);
    border-radius:3px;padding:5px 7px;font-size:12px;
  }
  .row-ctl textarea{resize:vertical;min-height:52px;line-height:1.4}
  .row-ctl input:focus-visible,.row-ctl select:focus-visible,.row-ctl textarea:focus-visible{
    outline:2px solid var(--signal);outline-offset:1px;border-color:transparent
  }
  .tri{display:flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
  .tri button{
    flex:1;border:0;background:var(--ground);padding:4px 6px;cursor:pointer;
    font-size:11px;color:var(--dim);border-left:1px solid var(--rule);
  }
  .tri button:first-child{border-left:0}
  .tri button[aria-pressed=true]{background:var(--ink);color:var(--ground)}
  .tri button:focus-visible{outline:2px solid var(--signal);outline-offset:-2px}

  .add{
    width:100%;border:1px dashed var(--rule);background:none;border-radius:3px;
    padding:5px;margin-top:7px;cursor:pointer;color:var(--dim);font-size:12px;
  }
  .add:hover{border-color:var(--a);color:var(--a)}
  .picker{margin-top:7px;border:1px solid var(--a);border-radius:3px;overflow:hidden}
  .picker input{width:100%;border:0;border-bottom:1px solid var(--rule);
    background:var(--ground);padding:6px 8px;font-size:12px}
  .picker input:focus-visible{outline:2px solid var(--signal);outline-offset:-2px}
  .picker ul{list-style:none;margin:0;padding:0;max-height:186px;overflow-y:auto}
  .picker li button{
    width:100%;text-align:left;border:0;background:none;padding:6px 8px;cursor:pointer;
    border-bottom:1px solid var(--rule);
  }
  .picker li:last-child button{border-bottom:0}
  .picker li button:hover,.picker li button:focus-visible{background:var(--signal-wash);outline:none}
  .picker .pf{font-weight:600;font-size:12px;word-break:break-all}
  .picker .ph{color:var(--dim);font-size:11px;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .picker .none{padding:8px;color:var(--dim);font-size:11px}

  /* source / sink 노드 */
  .node.io textarea{
    width:100%;background:var(--ground);border:1px solid var(--rule);border-radius:3px;
    padding:6px 8px;font-size:12px;resize:vertical;min-height:58px;line-height:1.5;
  }
  .node.io textarea:focus-visible{outline:2px solid var(--signal);outline-offset:1px;border-color:transparent}
  .sink-stat{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .sink-stat span{border:1px solid var(--rule);border-radius:9px;padding:1px 8px;font-size:11px;color:var(--dim)}

  /* ── 포맷 서브그래프 노드 ────────────────── */
  .fsel{display:flex;flex-direction:column;gap:5px}
  .fsel select,.fsel input{
    width:100%;background:var(--ground);border:1px solid var(--rule);
    border-radius:3px;padding:5px 7px;font-size:12px;
  }
  .fsel select:focus-visible,.fsel input:focus-visible{
    outline:2px solid var(--signal);outline-offset:1px;border-color:transparent}
  .fsel .why{color:var(--dim);font-size:11px;line-height:1.45}

  .filt{border-top:1px solid var(--rule);margin-top:7px;padding-top:7px}
  .filt-head{display:flex;align-items:center;gap:6px;margin-bottom:5px}
  .filt-head span{color:var(--dim);font-size:10px;letter-spacing:.12em;text-transform:uppercase;flex:1}
  .filt-row{display:grid;grid-template-columns:1fr 62px 1fr auto auto;gap:4px;margin-bottom:4px;align-items:center}
  .filt-row.exists{grid-template-columns:1fr 62px auto}
  .filt-q{display:flex;align-items:center;color:var(--dim);font-size:11px;cursor:pointer;user-select:none}
  .filt-q input{width:auto;margin:0 2px 0 0}
  .filt-q:has(input:checked){color:var(--set);font-weight:600}
  .filt-row select,.filt-row input{
    min-width:0;background:var(--ground);border:1px solid var(--rule);
    border-radius:3px;padding:4px 5px;font-size:11px;
  }
  .filt-row select:focus-visible,.filt-row input:focus-visible{
    outline:2px solid var(--signal);outline-offset:1px;border-color:transparent}
  .filt-loose{display:flex;align-items:center;gap:5px;color:var(--dim);font-size:11px;margin-top:2px}
  .filt-loose input{width:auto}

  .ops{color:var(--dim);font-size:11px;line-height:1.6}
  .ops ol{margin:5px 0 0;padding-left:20px}
  .ops ol li{margin-bottom:2px;color:var(--ink);word-break:break-all}
  .ops .warn{color:var(--warn)}
  .fout-expr{
    background:var(--ground);border:1px solid var(--rule);border-radius:3px;
    padding:8px 9px;font-size:12px;line-height:1.6;word-break:break-all;min-height:34px;
  }
  .fout-expr:empty::before{content:"아직 아무것도 이어지지 않았다";color:var(--dim)}
  .fout-issue{color:var(--warn);font-size:11px;margin-top:6px;line-height:1.5}

  /* canvas HUD */
  .hud{
    position:absolute;right:12px;bottom:12px;display:flex;gap:6px;align-items:center;
    background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:4px 6px;z-index:20;
  }
  .hud button{border:0;background:none;cursor:pointer;color:var(--dim);padding:2px 7px;border-radius:3px;font-size:13px}
  .hud button:hover{color:var(--signal);background:var(--signal-wash)}
  .hud .zoom{color:var(--dim);font-size:11px;min-width:38px;text-align:center}

  .ghost-hint{
    position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;
    color:var(--dim);text-align:center;line-height:1.9;padding:20px;z-index:1;
  }
  .ghost-hint b{color:var(--ink);font-weight:500}
  .ghost-hint[hidden]{display:none}

  /* ── command readout ────────────────────── */
  .readout{
    border-top:1px solid var(--rule);background:var(--panel);
    padding:10px 18px 12px;flex:none;
  }
  .readout-bar{display:flex;align-items:center;gap:10px;margin-bottom:7px;flex-wrap:wrap}
  .readout-bar h2{
    margin:0;font:500 10px/1 var(--mono);letter-spacing:.14em;
    text-transform:uppercase;color:var(--dim)
  }
  .readout-bar .spacer{flex:1}
  .cmd{
    background:var(--ground);border:1px solid var(--rule);border-radius:3px;
    padding:10px 12px;overflow-x:auto;white-space:pre-wrap;word-break:break-all;
    line-height:1.9;max-height:22vh;
  }
  .cmd .prompt{color:var(--dim);user-select:none}
  .tok{border-bottom:2px solid transparent;padding-bottom:1px;cursor:default;transition:background .1s}
  .tok[data-opt]{border-bottom-color:var(--rule)}
  .tok.lit{background:var(--signal);color:#fff;border-bottom-color:var(--signal)}
  .tok.url{color:var(--set);font-weight:600}

  .notes{margin-top:6px;color:var(--dim);font-size:11px;min-height:1.4em}
  .notes b{color:var(--warn);font-weight:500}

  /* dialogs */
  dialog{
    border:1px solid var(--ink);border-radius:4px;background:var(--panel);
    color:var(--ink);padding:0;max-width:min(720px,92vw);width:100%;
  }
  dialog::backdrop{background:#141C1980}
  .dlg{padding:18px 20px 16px}
  .dlg h3{margin:0 0 4px;font:700 17px/1.2 var(--display)}
  .dlg p{margin:0 0 12px;color:var(--dim);font-size:12px}
  .dlg textarea{
    width:100%;min-height:150px;background:var(--ground);border:1px solid var(--rule);
    border-radius:3px;padding:9px;resize:vertical;line-height:1.5;font-size:12px;
  }
  .dlg textarea:focus-visible{outline:2px solid var(--signal);outline-offset:1px}
  .dlg-act{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}

  @media (max-width:860px){
    .palette{position:absolute;left:0;top:0;bottom:0;z-index:30;transform:translateX(-100%);
      transition:transform .16s;box-shadow:0 0 30px #141c1926}
    .palette.open{transform:none}
    .main{position:relative}
    .field{flex-basis:100%}
    #pal-toggle{display:inline-block}
  }
  #pal-toggle{display:none}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div>
    <div class="wordmark">yt-dlp <em>스튜디오</em></div>
    <div class="ver" id="ver"></div>
  </div>

  <div class="crumb" id="crumb" hidden>
    <button class="back" id="crumb-back">← 파이프라인</button>
    <span class="sep">/</span>
    <span class="here">[format] 포맷 셀렉터 <code id="crumb-expr"></code></span>
  </div>

  <div class="field" id="field-q">
    <label for="q">검색</label>
    <input id="q" type="text" placeholder="자막 · sub · thumbnail · 403  ( / 키 )" spellcheck="false" autocomplete="off">
    <div class="hits" id="hits" hidden></div>
  </div>
  <div class="top-spacer"></div>
  <div class="topact">
    <button class="btn" id="pal-toggle">노드</button>
    <button class="btn" id="import">명령어 읽기</button>
    <button class="btn" id="graph-io">그래프 JSON</button>
    <button class="btn" id="reset">초기화</button>
  </div>
</header>

<div class="main">
  <aside class="palette" id="palette" aria-label="노드 팔레트">
    <div class="pal-head" id="pal-head">실행 단계</div>
    <div class="pal-hint" id="pal-hint"></div>
    <div id="pal-list"></div>
    <hr class="pal-sep">
    <div class="pal-act">
      <button class="btn" id="autolayout">정렬</button>

<script>
/* 빌드가 src/core/*.js 를 여기 이어 붙인다. */
/* ── src/core/schema.js ─────────────────────────── */
/**
 * yt-dlp 옵션 스키마 파생.
 *
 * gen_schema.py 가 떨군 raw JSON 하나에서 색인들을 만든다.
 * initSchema 를 부르기 전에는 어떤 바인딩도 유효하지 않다.
 */

let STAGES = [];
let OPTS = [];
let BY_ID = {};
let STAGE_ORDER = [];
let STAGE = {};
let BY_STAGE = {};
let BY_FLAG = {};       // 플래그 문자열 → { opt, negated }
let HAY = {};           // 검색 색인
let VERSION = '';

/**
 * 한국어 의도 → yt-dlp 어휘.
 *
 * introspection 이 절대 못 주는 층이라 손으로 채운다. 이 도구의 실제
 * 부가가치가 여기 있다. 쓰다가 안 걸리는 말이 나오면 계속 추가할 것.
 */
const KO = {
  '자막':'sub subtitle srt','자동자막':'auto-sub automatic','번역':'sub translate',
  '썸네일':'thumbnail','표지':'thumbnail cover','화질':'format quality resolution height',
  '해상도':'height width resolution format','포맷':'format container','코덱':'vcodec acodec format-sort',
  '음원':'audio extract-audio','오디오':'audio','소리':'audio','음성':'audio',
  '영상만':'video-only format','재생목록':'playlist','플레이리스트':'playlist',
  '채널':'playlist flat-playlist','구간':'download-sections chapter split',
  '자르기':'download-sections split-chapters','챕터':'chapter',
  '광고':'sponsorblock','스폰서':'sponsorblock','건너뛰':'sponsorblock skip',
  '쿠키':'cookies browser','로그인':'username password cookies netrc','인증':'auth username password',
  '프록시':'proxy socket source-address','우회':'proxy geo impersonate',
  '차단':'geo proxy impersonate','지역':'geo xff','아이피':'source-address proxy',
  '속도':'rate-limit throttled concurrent','제한':'limit rate','동시':'concurrent fragments',
  '재시도':'retries retry','이어받기':'continue part','중단':'abort break',
  '중복':'download-archive no-overwrites','기록':'archive','아카이브':'archive',
  '파일명':'output paths restrict-filenames windows-filenames','경로':'paths output home',
  '이름':'output filename','폴더':'paths output batch',
  '병합':'merge-output-format remux recode','변환':'recode remux audio-format',
  '메타데이터':'metadata embed-metadata parse-metadata','태그':'metadata',
  '자바스크립트':'extractor-args player','확장':'extractor-args plugin',
  '로그':'verbose print quiet progress dump','조용':'quiet no-warnings',
  '미리보기':'simulate print list-formats dump-json','목록':'list-formats list-subs print',
  '테스트':'simulate skip-download','받지않':'skip-download simulate',
  '느림':'concurrent rate-limit downloader','에러':'ignore-errors abort verbose retries',
  '403':'impersonate extractor-args cookies user-agent','429':'sleep-requests rate-limit retries',
  '기다':'sleep wait-for-video','라이브':'live-from-start wait-for-video',
};

/** 검색어 하나를 KO 사전으로 넓힌다. */
function expand(t) {
  const out = [t];
  for (const k in KO) if (k.includes(t) || t.includes(k)) out.push(...KO[k].split(' '));
  return out;
}

/** 공백으로 나눈 모든 항이 각각 (넓혀서) 걸려야 통과. 빈 질의는 null. */
function search(q, pool) {
  const s = (q || '').trim().toLowerCase();
  if (!s) return null;
  const terms = s.split(/\s+/).map(expand);
  return (pool || OPTS).filter(o => terms.every(g => g.some(t => HAY[o.id].includes(t))));
}

function initSchema(raw) {
  VERSION = raw.ytdlp_version;
  STAGES = raw.stages;
  OPTS = raw.options;
  BY_ID = Object.fromEntries(OPTS.map(o => [o.id, o]));
  STAGE_ORDER = STAGES.map(s => s.id);
  STAGE = Object.fromEntries(STAGES.map(s => [s.id, s]));
  BY_STAGE = Object.fromEntries(STAGE_ORDER.map(s => [s, OPTS.filter(o => o.stage === s)]));

  // 별칭·단축·부정형까지 전부 색인해 둔다 (명령어 → 그래프 역방향용).
  BY_FLAG = {};
  for (const o of OPTS) {
    BY_FLAG[o.flag] = { opt: o, negated: false };
    if (o.short) BY_FLAG[o.short] = { opt: o, negated: false };
    for (const a of o.aliases) BY_FLAG[a] = { opt: o, negated: false };
    if (o.negation) BY_FLAG[o.negation] = { opt: o, negated: true };
  }

  HAY = Object.fromEntries(OPTS.map(o =>
    [o.id, (o.flag + ' ' + (o.short || '') + ' ' + o.aliases.join(' ') + ' ' + o.help).toLowerCase()]));

  return { STAGES, OPTS, STAGE_ORDER };
}

const stageIdx = id => STAGE_ORDER.indexOf(id);

/* ── src/core/graph.js ─────────────────────────── */
/**
 * 그래프 원시 연산. 어떤 종류의 그래프인지 모른다.
 *
 * 그래프는 { nodes: {id: {id, x, y, …}}, edges: [{from, to}] } 하나뿐이고,
 * "무엇이 살아 있는가 / 어떤 순서인가" 같은 의미론은 도메인이 얹는다.
 */

function adjacency(g) {
  const out = {}, inn = {};
  for (const id in g.nodes) { out[id] = []; inn[id] = []; }
  for (const e of g.edges) {
    if (out[e.from] && inn[e.to]) { out[e.from].push(e.to); inn[e.to].push(e.from); }
  }
  return { out, inn };
}

/** start 에서 adj 를 따라 닿는 모든 노드. adj 는 out 이면 순방향, inn 이면 역방향. */
function reach(start, adj) {
  const seen = new Set(), st = [start];
  while (st.length) {
    const v = st.pop();
    if (seen.has(v)) continue;
    seen.add(v);
    for (const w of adj[v] || []) st.push(w);
  }
  return seen;
}

function createsCycle(g, from, to) {
  return reach(to, adjacency(g).out).has(from);   // to 에서 from 으로 돌아오면 순환
}

const hasEdge = (g, from, to) => g.edges.some(e => e.from === from && e.to === to);

/**
 * 이을 수 있으면 잇고 true. 자기 자신·중복·순환은 거부한다.
 * exclusiveIn 에 든 노드는 입력을 하나만 받으므로 기존 것을 밀어낸다.
 */
function connect(g, from, to, { exclusiveIn } = {}) {
  if (from === to) return false;
  if (!g.nodes[from] || !g.nodes[to]) return false;
  if (hasEdge(g, from, to)) return false;
  if (createsCycle(g, from, to)) return false;
  if (exclusiveIn && exclusiveIn.has(to)) g.edges = g.edges.filter(e => e.to !== to);
  g.edges.push({ from, to });
  return true;
}

function disconnect(g, from, to) {
  const before = g.edges.length;
  g.edges = g.edges.filter(e => !(e.from === from && e.to === to));
  return g.edges.length !== before;
}

/**
 * 노드를 지우되 앞뒤를 다시 이어 사슬이 끊기지 않게 한다.
 * 지웠으면 true.
 */
function removeNode(g, id, opts = {}) {
  if (opts.protectedIds && opts.protectedIds.has(id)) return false;
  if (!g.nodes[id]) return false;
  const before = g.edges.filter(e => e.to === id).map(e => e.from);
  const after = g.edges.filter(e => e.from === id).map(e => e.to);
  g.edges = g.edges.filter(e => e.from !== id && e.to !== id);
  for (const a of before) for (const b of after) connect(g, a, b, opts);
  delete g.nodes[id];
  return true;
}

/**
 * ids 를 위상 정렬한다. 같은 층에서는 cmp 가 순서를 정한다.
 * 사이클이 있으면 닿지 못한 노드는 결과에서 빠진다(connect 가 막으므로 정상 경로에선 안 생긴다).
 */
function topoOrder(ids, g, cmp) {
  const set = new Set(ids);
  const { out, inn } = adjacency(g);
  const indeg = {};
  for (const id of ids) indeg[id] = inn[id].filter(p => set.has(p)).length;
  let q = ids.filter(id => indeg[id] === 0);
  const order = [];
  while (q.length) {
    q.sort(cmp);
    const v = q.shift();
    order.push(v);
    for (const w of out[v]) if (set.has(w) && --indeg[w] === 0) q.push(w);
  }
  return order;
}

/** 그래프에 없는 노드를 가리키는 엣지를 걷어낸다. 복원·불러오기 직후에 쓴다. */
function pruneEdges(g) {
  g.edges = (g.edges || []).filter(e => g.nodes[e.from] && g.nodes[e.to]);
  return g;
}

/* ── src/core/format-grammar.js ─────────────────────────── */
/**
 * yt-dlp 포맷 셀렉터 문법.
 *
 * -f 는 평평한 값이 아니라 표현식이다. 이 파일이 그 문법의 전부이며,
 * DOM 도 앱 상태도 모른다. 그래서 브라우저 없이 단위 테스트할 수 있다.
 *
 *   atom     := 셀렉터 필터*          bv*[height<=1080]
 *   merge    := atom ('+' atom)*      bv+ba
 *   fallback := merge ('/' merge)*    bv+ba/b   ==   (bv+ba)/b
 *   multi    := fallback (',' …)*     bv,ba
 */

/** 연산자 우선순위. 자식이 부모보다 낮으면 괄호로 묶는다. */
const PREC = { multi: 0, fallback: 1, merge: 2, sel: 3 };

/** 표현식 노드가 되는 연산자들. */
const FORMAT_OPS = ['merge', 'fallback', 'multi'];

/** 연산자 → 표기 기호. */
const OP_SEP = { merge: '+', fallback: '/', multi: ',' };

/* ── 셀렉터 어휘 ─────────────────────────── */
const SELECTORS = [
  ['영상 + 음성 (한 파일)', [
    ['b',  'best — 영상·음성이 같이 든 것 중 최고'],
    ['b*', 'best* — 종류 안 가리고 최고'],
    ['w',  'worst — 같이 든 것 중 최저'],
    ['w*', 'worst* — 종류 안 가리고 최저'],
  ]],
  ['영상만', [
    ['bv',  'bestvideo — 영상만 든 것 중 최고'],
    ['bv*', 'bestvideo* — 영상이 든 것 중 최고 (음성 동봉 허용)'],
    ['wv',  'worstvideo — 영상만 든 것 중 최저'],
    ['wv*', 'worstvideo* — 영상이 든 것 중 최저'],
  ]],
  ['음성만', [
    ['ba',  'bestaudio — 음성만 든 것 중 최고'],
    ['ba*', 'bestaudio* — 음성이 든 것 중 최고 (영상 동봉 허용)'],
    ['wa',  'worstaudio — 음성만 든 것 중 최저'],
    ['wa*', 'worstaudio* — 음성이 든 것 중 최저'],
  ]],
];
const SEL_HELP = Object.fromEntries(SELECTORS.flatMap(([, items]) => items));
const SEL_SET = new Set(Object.keys(SEL_HELP));

/* ── 필터 어휘 ───────────────────────────── */
// yt-dlp 문서의 필터 필드. num/str 에 따라 쓸 수 있는 연산자가 다르다.
const FKEYS = [
  ['height','세로 해상도','num'], ['width','가로 해상도','num'], ['fps','프레임','num'],
  ['tbr','전체 비트레이트','num'], ['vbr','영상 비트레이트','num'], ['abr','음성 비트레이트','num'],
  ['asr','샘플레이트','num'], ['audio_channels','음성 채널 수','num'],
  ['filesize','파일 크기','num'], ['filesize_approx','대략 크기','num'], ['aspect_ratio','화면비','num'],
  ['ext','확장자','str'], ['vcodec','영상 코덱','str'], ['acodec','음성 코덱','str'],
  ['container','컨테이너','str'], ['protocol','프로토콜','str'], ['format_id','포맷 ID','str'],
  ['format_note','포맷 노트','str'], ['resolution','해상도','str'], ['language','언어','str'],
  ['dynamic_range','다이내믹 레인지','str'],
];
const FKEY_TYPE = Object.fromEntries(FKEYS.map(([k, , t]) => [k, t]));

const NUM_OPS = [['<','<'],['<=','≤'],['>','>'],['>=','≥'],['=','='],['!=','≠']];
const STR_OPS = [['=','='],['!=','≠'],['^=','로 시작'],['$=','로 끝남'],['*=','포함'],['~=','정규식'],
                        ['!^=','로 시작 안 함'],['!$=','로 끝나지 않음'],['!*=','포함 안 함'],['!~=','정규식 불일치']];
const EXIST_OPS = [['has','있음'],['hasnot','없음']];
const OP_LABEL = Object.fromEntries([...NUM_OPS, ...STR_OPS, ...EXIST_OPS]);

const isExistOp = op => op === 'has' || op === 'hasnot';

/* ── 파싱 ────────────────────────────────── */
/** `height<=?1080` · `format_note` · `!format_note` 를 {key, op, loose, value} 로. */
function parseFilterBody(body) {
  const b = body.trim();
  if (!b) throw new Error('빈 필터');
  const m = b.match(/^([A-Za-z_][A-Za-z0-9_]*)\s*(!?[\^$*~]?=|<=|>=|<|>)(\??)\s*(.*)$/);
  if (m) return { key: m[1], op: m[2], loose: m[3] === '?', value: m[4].trim() };
  if (/^![A-Za-z_][A-Za-z0-9_]*$/.test(b)) return { key: b.slice(1), op: 'hasnot', value: '' };
  if (/^[A-Za-z_][A-Za-z0-9_]*$/.test(b)) return { key: b, op: 'has', value: '' };
  throw new Error(`필터를 읽지 못했다: [${body}]`);
}

/** 포맷 셀렉터 문자열 → 트리. 못 읽으면 이유를 담아 던진다. */
function parseFormat(src) {
  const s = (src || '').trim();
  if (!s) return null;
  let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++; };
  const peek = () => s[i];

  const expr = () => multi();
  function multi() {
    const kids = [fallback()]; ws();
    while (peek() === ',') { i++; kids.push(fallback()); ws(); }
    return kids.length === 1 ? kids[0] : { t: 'multi', kids };
  }
  function fallback() {
    const kids = [merge()]; ws();
    while (peek() === '/') { i++; kids.push(merge()); ws(); }
    return kids.length === 1 ? kids[0] : { t: 'fallback', kids };
  }
  function merge() {
    const kids = [atom()]; ws();
    while (peek() === '+') { i++; kids.push(atom()); ws(); }
    return kids.length === 1 ? kids[0] : { t: 'merge', kids };
  }
  function atom() {
    ws();
    if (peek() === '(') {
      i++; const inner = expr(); ws();
      if (peek() !== ')') throw new Error("')' 가 닫히지 않았다");
      i++; ws();
      if (peek() === '[') throw new Error('그룹에 바로 붙은 필터는 아직 그래프로 못 읽는다');
      return inner;
    }
    const start = i;
    while (i < s.length && /[A-Za-z0-9_*.\-]/.test(s[i])) i++;
    if (i === start) throw new Error(`셀렉터를 찾지 못했다 (${i + 1}번째 글자 근처)`);
    const name = s.slice(start, i);
    const filters = [];
    ws();
    while (peek() === '[') {
      i++;
      const j = s.indexOf(']', i);
      if (j < 0) throw new Error("']' 가 닫히지 않았다");
      filters.push(parseFilterBody(s.slice(i, j)));
      i = j + 1; ws();
    }
    return { t: 'sel', name, filters };
  }

  const tree = expr(); ws();
  if (i < s.length) throw new Error(`읽고 남은 글자: "${s.slice(i)}"`);
  return tree;
}

/* ── 컴파일 ──────────────────────────────── */
function emitFilter(f) {
  if (f.op === 'has') return '[' + f.key + ']';
  if (f.op === 'hasnot') return '[!' + f.key + ']';
  return '[' + f.key + f.op + (f.loose ? '?' : '') + f.value + ']';
}

function emitTree(n) {
  if (!n) return '';
  if (n.t === 'sel') return n.name + (n.filters || []).map(emitFilter).join('');
  return n.kids.map(k => {
    const s = emitTree(k);
    return PREC[k.t] < PREC[n.t] ? '(' + s + ')' : s;   // 우선순위가 낮으면 괄호로 묶는다
  }).join(OP_SEP[n.t]);
}

/* ── src/core/format-graph.js ─────────────────────────── */
/**
 * 포맷 셀렉터 서브그래프 ↔ 표현식 트리.
 *
 * 그래프 쪽 의미론은 두 가지뿐이다.
 *   · -f 출력(fout)에 닿는 노드만 표현식에 들어간다
 *   · 연산자의 피연산자 순서는 노드의 세로 위치를 따른다
 */


const FOUT = 'fout';

function blankFormat(x = 560, y = 210) {
  return {
    nodes: { [FOUT]: { id: FOUT, type: 'fout', x, y } },
    edges: [],
    view: { x: 0, y: 0, k: 1 },
  };
}

/** 연산자의 피연산자들. 세로 위치 순, 같으면 가로 순. */
function operands(g, id) {
  return g.edges.filter(e => e.to === id)
    .map(e => g.nodes[e.from]).filter(Boolean)
    .sort((a, b) => (a.y - b.y) || (a.x - b.x));
}

/** -f 출력에 닿는 노드 집합. 나머지는 표현식에 기여하지 않는다. */
const formatLive = g => reach(FOUT, adjacency(g).inn);

/** 서브그래프 → 표현식 트리. 비어 있으면 null. */
function graphToTree(g, id = FOUT, seen = new Set()) {
  const n = g.nodes[id];
  if (!n || seen.has(id)) return null;
  seen.add(id);
  if (n.type === 'stream') {
    if (!n.sel) return null;
    return { t: 'sel', name: n.sel, filters: (n.filters || []).filter(f => f.key) };
  }
  const kids = operands(g, id)
    .map(k => graphToTree(g, k.id, new Set(seen)))
    .filter(Boolean);
  if (n.type === 'fout') return kids[0] || null;
  if (!kids.length) return null;
  if (kids.length === 1) return kids[0];     // 피연산자가 하나면 연산자는 통과시킨다
  return { t: n.type, kids };
}

/** 서브그래프가 컴파일하는 --format 값. */
const formatExpr = g => emitTree(graphToTree(g));

/** 사람이 고칠 만한 문제들. tagOf 로 노드 종류의 표기를 받는다. */
function formatIssues(g, tagOf = t => t) {
  const live = formatLive(g);
  const out = [];
  for (const id in g.nodes) {
    const n = g.nodes[id];
    if (n.id === FOUT) continue;
    if (!live.has(n.id)) { out.push(`[${tagOf(n.type)}] 노드가 -f 출력에 이어지지 않았다`); continue; }
    if (n.type === 'stream' && !n.sel) out.push('스트림 노드에 셀렉터가 비어 있다');
    if (FORMAT_OPS.includes(n.type)) {
      const k = operands(g, n.id).length;
      if (k < 2) out.push(`[${tagOf(n.type)}] 노드에 이어진 입력이 ${k}개뿐이다 — 그냥 통과된다`);
    }
  }
  return [...new Set(out)];
}

/**
 * 표현식 트리 → 서브그래프.
 * 오른쪽 끝이 -f 출력, 왼쪽으로 갈수록 깊어진다. 열 간격은 노드 폭보다 넓어야 겹치지 않는다.
 */
function treeToGraph(tree, { nid, nodeW = 300, gapX = 90, gapY = 200 } = {}) {
  const g = blankFormat();
  g._tidy = true;                   // DOM 이 생기면 실측해서 다시 정돈하라는 표시
  if (!tree) return g;

  const PX = nodeW + gapX;
  const depthOf = n => n.t === 'sel' ? 0 : 1 + Math.max(...n.kids.map(depthOf));
  const maxDepth = depthOf(tree);
  let slot = 0;

  const walk = (n, depth) => {
    if (n.t === 'sel') {
      const id = nid();
      g.nodes[id] = { id, type: 'stream', sel: n.name, filters: n.filters || [], x: 0, y: slot++ * gapY, _d: depth };
      return id;
    }
    const kids = n.kids.map(k => walk(k, depth + 1));
    const id = nid();
    const y = kids.reduce((a, k) => a + g.nodes[k].y, 0) / kids.length;
    g.nodes[id] = { id, type: n.t, x: 0, y, _d: depth };
    for (const k of kids) g.edges.push({ from: k, to: id });
    return id;
  };

  const rootId = walk(tree, 0);
  for (const id in g.nodes) {
    const n = g.nodes[id];
    if (n.id === FOUT) continue;
    n.x = (maxDepth - n._d) * PX;
    n.y = Math.round(n.y) + 60;
    delete n._d;
  }
  g.nodes[FOUT].x = (maxDepth + 1) * PX;
  g.nodes[FOUT].y = Math.round(g.nodes[rootId].y);
  g.edges.push({ from: rootId, to: FOUT });
  return g;
}

/* ── src/core/pipeline.js ─────────────────────────── */
/**
 * 파이프라인 그래프의 의미론과 명령어 조립.
 *
 *   · 소스에서 명령어 노드까지 이어진 노드만 결과에 들어간다
 *   · 플래그 순서는 그래프의 위상 정렬 순서를 따른다 (같은 층이면 x 좌표 순)
 */


const SRC = 'src';
const OUT = 'out';

function blankPipeline() {
  return {
    nodes: {
      [SRC]: { id: SRC, type: 'source', x: 60,  y: 190, urls: '' },
      [OUT]: { id: OUT, type: 'sink',   x: 700, y: 190 },
    },
    edges: [{ from: SRC, to: OUT }],
    view: { x: 0, y: 0, k: 1 },
  };
}

const stageNode = (g, sid) =>
  Object.values(g.nodes).find(n => n.type === 'stage' && n.stage === sid);

/** src 에서 출발해 out 까지 실제로 도달하는 노드들을, 실행 순서대로. */
function livePath(g) {
  const { out, inn } = adjacency(g);
  const fwd = reach(SRC, out), bwd = reach(OUT, inn);
  const live = Object.keys(g.nodes).filter(id => fwd.has(id) && bwd.has(id));
  const cmp = (a, b) => (g.nodes[a].x - g.nodes[b].x)
    || (stageIdx(g.nodes[a].stage) - stageIdx(g.nodes[b].stage));
  return topoOrder(live, g, cmp);
}
const pipelineLive = g => new Set(livePath(g));

/** 새 단계 노드를 단계 순서에 맞는 자리에 끼워 넣는다. 단순 사슬이 아니면 손대지 않는다. */
function spliceIntoChain(g, node) {
  const chain = [];
  const { out } = adjacency(g);
  let cur = SRC;
  const seen = new Set();
  while (cur && !seen.has(cur)) {
    seen.add(cur);
    chain.push(cur);
    if (cur === OUT) break;
    const next = (out[cur] || []).filter(id => id !== node.id);
    if (next.length !== 1) return false;      // 사슬이 아니다 → 손으로 잇게 둔다
    cur = next[0];
  }
  if (chain[chain.length - 1] !== OUT) return false;

  const rank = id => id === SRC ? -1 : id === OUT ? 99 : stageIdx(g.nodes[id].stage);
  let i = 0;
  while (i < chain.length - 1 && rank(chain[i + 1]) < stageIdx(node.stage)) i++;
  const prev = chain[i], next = chain[i + 1];
  g.edges = g.edges.filter(e => !(e.from === prev && e.to === next));
  g.edges.push({ from: prev, to: node.id }, { from: node.id, to: next });
  return true;
}

/* ── 명령어 조립 ─────────────────────────── */
const SAFE = /^[A-Za-z0-9._:,\/=+@%^-]+$/;
const quote = v => SAFE.test(v) ? v : '"' + String(v).replace(/([\\"$`])/g, '\\$1') + '"';

/** 살아 있는 경로를 순서대로 훑으며 토큰을 뽑는다. */
function buildTokens(g) {
  const toks = [];
  for (const id of livePath(g)) {
    const n = g.nodes[id];
    if (n.type !== 'stage') continue;
    const vals = n.values || {};
    for (const o of BY_STAGE[n.stage]) {
      if (!(o.id in vals) || vals[o.id] === '') continue;
      const v = vals[o.id];
      if (v === true) toks.push({ node: n.id, opt: o, text: o.short || o.flag });
      else if (v === false) { if (o.negation) toks.push({ node: n.id, opt: o, text: o.negation }); }
      else if (o.kind === 'repeatable') {
        for (const line of String(v).split('\n').map(s => s.trim()).filter(Boolean))
          toks.push({ node: n.id, opt: o, text: (o.short || o.flag) + ' ' + quote(line) });
      } else toks.push({ node: n.id, opt: o, text: (o.short || o.flag) + ' ' + quote(String(v)) });
    }
  }
  return toks;
}

const urlList = g =>
  ((g.nodes[SRC] && g.nodes[SRC].urls) || '').split('\n').map(s => s.trim()).filter(Boolean);

const commandString = g =>
  ['yt-dlp', ...buildTokens(g).map(t => t.text), ...urlList(g).map(quote)].join(' ');

const confString = g => buildTokens(g).map(t => t.text).join('\n') + '\n';

/* ── 역방향: 명령어 → 값 ─────────────────── */
/** 셸 인용을 존중하며 토큰으로 쪼갠다. */
function tokenize(s) {
  const out = []; let cur = '', q = null;
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (q) {
      if (c === '\\' && q === '"') { cur += s[++i] ?? ''; }
      else if (c === q) q = null;
      else cur += c;
    } else if (c === '"' || c === "'") q = c;
    else if (/\s/.test(c)) { if (cur) { out.push(cur); cur = ''; } }
    else cur += c;
  }
  if (cur) out.push(cur);
  return out;
}

/**
 * yt-dlp 명령어 문자열 → { urls, picked, unknown }.
 * picked 는 stage → { optId: value }. 그래프도 DOM 도 건드리지 않는다.
 */
function parseCommand(text) {
  const toks = tokenize((text || '').replace(/\\\n/g, ' '));
  if (toks[0] && /yt-dlp|youtube-dl/.test(toks[0])) toks.shift();

  const urls = [], picked = {}, unknown = [];
  for (let i = 0; i < toks.length; i++) {
    let t = toks[i];
    if (!t.startsWith('-')) { urls.push(t); continue; }
    let inline = null;
    if (t.includes('=') && t.startsWith('--')) { const k = t.indexOf('='); inline = t.slice(k + 1); t = t.slice(0, k); }
    const hit = BY_FLAG[t];
    if (!hit) { unknown.push(t); continue; }
    const { opt, negated } = hit;
    const bag = (picked[opt.stage] ||= {});
    if (opt.kind === 'flag') { bag[opt.id] = !negated; continue; }
    const v = inline ?? toks[++i];
    if (v === undefined) { unknown.push(t); continue; }
    if (opt.kind === 'repeatable' && bag[opt.id]) bag[opt.id] += '\n' + v;
    else bag[opt.id] = v;
  }
  return { urls, picked, unknown };
}

/* ── src/core/layout.js ─────────────────────────── */
/**
 * 좌표 계산.
 *
 * 노드 높이는 내용에 따라 달라서 실측이 필요하지만, 그 실측은 호출자가
 * heightOf 로 넘긴다. 그래서 이 파일은 DOM 을 모르고 단위 테스트가 된다.
 */

/**
 * 열마다 세로로 풀어 준다.
 * 연산자는 피연산자들의 세로 중심으로 끌어오되, 겹치면 아래로 밀어 순서는 보존한다.
 */
function tidyColumns(g, heightOf, { gap = 26, operandsOf } = {}) {
  const all = Object.values(g.nodes);
  const cols = [...new Set(all.map(n => Math.round(n.x)))].sort((a, b) => a - b);
  for (const x of cols) {
    const col = all.filter(n => Math.round(n.x) === x);
    if (operandsOf) {
      for (const n of col) {
        const ins = operandsOf(g, n.id);
        if (ins.length) {
          const mid = ins.reduce((a, k) => a + k.y + heightOf(k.id) / 2, 0) / ins.length;
          n.y = Math.round(mid - heightOf(n.id) / 2);
        }
      }
    }
    col.sort((a, b) => a.y - b.y);
    for (let i = 1; i < col.length; i++) {
      const min = col[i - 1].y + heightOf(col[i - 1].id) + gap;
      if (col[i].y < min) col[i].y = Math.round(min);
    }
  }
  return g;
}

/** 모든 노드를 담는 세계 좌표 사각형. */
function bounds(g, heightOf, { nodeW = 300, pad = 40 } = {}) {
  const ns = Object.values(g.nodes);
  if (!ns.length) return null;
  return {
    minX: Math.min(...ns.map(n => n.x)) - pad,
    maxX: Math.max(...ns.map(n => n.x)) + nodeW + pad,
    minY: Math.min(...ns.map(n => n.y)) - pad,
    maxY: Math.max(...ns.map(n => n.y + heightOf(n.id))) + pad,
  };
}

/** bounds 를 뷰포트에 맞추는 { x, y, k }. */
function fitTo(box, vpW, vpH, { min = 0.3, max = 1.1 } = {}) {
  if (!box) return null;
  const w = box.maxX - box.minX, h = box.maxY - box.minY;
  const k = Math.max(min, Math.min(max, Math.min(vpW / w, vpH / h)));
  return {
    k,
    x: (vpW - w * k) / 2 - box.minX * k,
    y: (vpH - h * k) / 2 - box.minY * k,
  };
}

/** 커서를 고정점으로 삼는 줌. */
function zoomAt(view, mx, my, factor, { min = 0.3, max = 2 } = {}) {
  const k = Math.max(min, Math.min(max, view.k * factor));
  return { k, x: mx - (mx - view.x) * (k / view.k), y: my - (my - view.y) * (k / view.k) };
}

/** 실행 순서를 왼쪽에서 오른쪽으로 늘어놓고, 경로 밖 노드는 아래에 남긴다. */
function chainLayout(g, order, { nodeW = 300, gapX = 78, top = 90, stagger = 74, orphanDrop = 430 } = {}) {
  const pitch = nodeW + gapX;
  const rest = Object.keys(g.nodes).filter(id => !order.includes(id));
  order.forEach((id, i) => {
    const n = g.nodes[id];
    n.x = 40 + i * pitch;
    n.y = top + (i % 2) * stagger;
  });
  rest.forEach((id, i) => {
    const n = g.nodes[id];
    n.x = 40 + i * pitch;
    n.y = top + orphanDrop;
  });
  return g;
}

/** 겹치지 않는 빈 자리를 찾는다. 세계 좌표. */
function freeSpot(g, x, y, { step = 34, drop = 30, near = 40, guard = 40 } = {}) {
  const taken = () => Object.values(g.nodes)
    .some(n => Math.abs(n.x - x) < near && Math.abs(n.y - y) < near);
  let i = 0;
  while (taken() && i++ < guard) { x += step; y += drop; }
  return [Math.round(x), Math.round(y)];
}

/** 표현식 그래프에서 fout 에 닿지 않는 노드들. 정렬할 때 아래로 내린다. */
const orphansOf = (g, root) => {
  const live = reach(root, adjacency(g).inn);
  return Object.values(g.nodes).filter(n => !live.has(n.id));
};

/* ── src/core/persist.js ─────────────────────────── */
/**
 * 저장·복원과 버전 마이그레이션.
 *
 * 저장물은 사용자의 것이다. 형식을 바꿀 때마다 옛 스냅샷을 읽어 주는
 * 경로를 여기 한곳에 모아 둔다.
 */

const STORE_KEY = 'ytstudio.graph.v3';
const LEGACY_KEYS = ['ytstudio.graph.v2'];

/** 직렬화 전에 걷어낼 내부 전용 필드. 저장물로 새면 안 된다. */
const TRANSIENT = ['_tidy'];

function snapshot(state, seq, mode) {
  const clean = JSON.parse(JSON.stringify(state));
  for (const g of [clean, clean.format]) {
    if (!g) continue;
    for (const k of TRANSIENT) delete g[k];
  }
  return { v: 3, seq, mode, state: clean };
}

/**
 * 스냅샷 → { state, seq, mode }. 읽을 수 없으면 null.
 * deps: { blankFormat, isValidStage }
 */
function restore(data, { blankFormat, isValidStage } = {}) {
  if (!data) return null;

  // v2 는 { v:2, seq, view, nodes, edges } 로 포맷 서브그래프가 없었다.
  let s = data.state;
  if (!s && data.nodes) s = { nodes: data.nodes, edges: data.edges || [], view: data.view, format: null };
  if (!s || !s.nodes || !s.nodes.src || !s.nodes.out) return null;

  if (isValidStage) {
    for (const id of Object.keys(s.nodes)) {
      const n = s.nodes[id];
      if (n.type === 'stage' && !isValidStage(n.stage)) delete s.nodes[id];
    }
  }
  pruneEdges(s);
  s.view = Object.assign({ x: 0, y: 0, k: 1 }, s.view);

  const f = s.format;
  if (!f || !f.nodes || !f.nodes.fout) {
    s.format = blankFormat ? blankFormat() : { nodes: {}, edges: [], view: { x: 0, y: 0, k: 1 } };
  } else {
    pruneEdges(s.format);
    s.format.view = Object.assign({ x: 0, y: 0, k: 1 }, f.view);
  }

  const seq = data.seq
    || (Object.keys(s.nodes).length + Object.keys(s.format.nodes).length + 1);
  const mode = data.mode === 'format' ? 'format' : 'pipeline';
  return { state: s, seq, mode };
}

/** v3 를 먼저 보고, 없으면 옛 키를 훑는다. */
function loadRaw(storage) {
  for (const key of [STORE_KEY, ...LEGACY_KEYS]) {
    try {
      const raw = storage.getItem(key);
      if (raw) return JSON.parse(raw);
    } catch { /* 깨진 저장물은 없는 셈 친다 */ }
  }
  return null;
}

  fout:     { label:'-f 출력', tag:'format',   accent:'#141C19', blurb:'여기 이어진 표현식이 --format 값이 된다' },
};
const FOP_TYPES = FORMAT_OPS;
/* ══ 그래프 상태 ═════════════════════════════ */
const NODE_W = 300, HEAD_H = 34;
const PROTECTED = new Set([SRC, OUT, FOUT]);

let state, view, seq;
const ui = {
  mode: 'pipeline', lit: null, sel: null, picker: null,
  unknown: [], drag: null, wire: null, pan: null, fmtWarn: '',
};

const blankState = () => Object.assign(blankPipeline(), { format: blankFormat() });

function resetState() {
  state = blankState();
  seq = 1;
  ui.mode = 'pipeline';
  view = state.view;
  ui.unknown = []; ui.sel = null; ui.picker = null; ui.fmtWarn = '';
}
resetState();

/** 지금 편집 중인 그래프. 파이프라인이거나 포맷 서브그래프거나. */
const graph = () => ui.mode === 'format' ? state.format : state;
const inFormat = () => ui.mode === 'format';

const nid = () => 'n' + (seq++);
const nodeList = (g = graph()) => Object.values(g.nodes);
const stageOf = sid => stageNode(state, sid);
const valuesOf = n => (n.values ||= {});
/** 렌더된 노드의 실제 높이. 레이아웃 계산에 넘겨 준다. */
const measuredHeight = id => {
  const el = document.querySelector(`.node[data-id="${id}"]`);
  return el ? el.offsetHeight : 190;
};
const filtersOf = n => (n.filters ||= []);

function accentOf(n) {
  if (n.type === 'stage') return ACCENT[n.stage];
  if (FTYPE[n.type]) return FTYPE[n.type].accent;
  return IO_ACCENT[n.id] || ACCENT.run;
}
function setCount(n) {
  if (n.type === 'stage') {
    const v = valuesOf(n);
    return Object.keys(v).filter(k => v[k] !== '').length;
  }
  if (n.type === 'stream') return filtersOf(n).length;
  return 0;
}

/* ── 그래프 질의 (모드 공용) ─────────────── */
// 원시 연산은 core/graph.js, 의미론은 core/pipeline.js · core/format-graph.js.
// 여기 남는 건 "지금 어느 모드냐"를 아는 얇은 층뿐이다.

/** 현재 모드에서 살아 있는 노드. 파이프라인은 src→out, 포맷은 fout 도달성. */
const liveIds = () => inFormat() ? formatLive(state.format) : pipelineLive(state);

/** -f 출력은 표현식 하나만 받는다. */
const EXCLUSIVE_IN = new Set([FOUT]);
const wire = (from, to, g = graph()) => connect(g, from, to, { exclusiveIn: EXCLUSIVE_IN });
const unwire = (from, to, g = graph()) => disconnect(g, from, to);

function dropNode(id, g = graph()) {
  const ok = removeNode(g, id, { protectedIds: PROTECTED, exclusiveIn: EXCLUSIVE_IN });
  if (!ok) return false;
  if (ui.sel === id) ui.sel = null;
  if (ui.picker && ui.picker.node === id) ui.picker = null;
  return true;
}
/* ── 파이프라인 전용 ─────────────────────── */
function addStageNode(sid, x, y) {
  const found = stageNode(state, sid);
  if (found) return found;
  const n = { id: nid(), type: 'stage', stage: sid, x, y, values: {} };
  state.nodes[n.id] = n;
  spliceIntoChain(state, n);
  return n;
}
/* ── 포맷 서브그래프 전용 ────────────────── */
// 트리 ↔ 그래프 변환과 문제 진단은 core/format-graph.js 에 있다.
const opsOf = id => operands(state.format, id);
const fmtIssues = () => formatIssues(state.format, t => FTYPE[t].tag);
const fmtExpr = () => formatExpr(state.format);

function addFormatNode(type, x, y, extra) {
  const n = Object.assign({ id: nid(), type, x, y }, extra || {});
  if (type === 'stream') { n.sel = n.sel || 'bv'; n.filters = n.filters || []; }
  state.format.nodes[n.id] = n;
  return n;
}

/** 노드 높이는 필터 개수에 따라 달라진다. 렌더된 뒤 실측해서 열마다 풀어 준다. */
function tidyFormat(g = state.format) {
  tidyColumns(g, measuredHeight, { operandsOf: operands });
}

/** 파이프라인의 --format 값을 서브그래프가 컴파일한 결과로 덮어쓴다. */
function syncFormatValue() {
  const n = stageNode(state, 'format');
  if (n) valuesOf(n).format = fmtExpr();
}
/* ── 좌표 변환 ───────────────────────────── */
const vp = () => $('#viewport').getBoundingClientRect();
function toWorld(clientX, clientY) {
  const r = vp();
  return { x: (clientX - r.left - view.x) / view.k, y: (clientY - r.top - view.y) / view.k };
}
const portPos = n => ({ inX: n.x, outX: n.x + NODE_W, y: n.y + HEAD_H / 2 });
const hasInPort = n => !(n.id === 'src' || n.type === 'stream');
const hasOutPort = n => !(n.id === 'out' || n.type === 'fout');

/* ══ 명령어 조립 ═════════════════════════════ */
// 조립·해석은 core/pipeline.js 에 있다. 여기서는 현재 상태를 넘기기만 한다.
const tokensNow = () => buildTokens(state);
const urlsNow = () => urlList(state);
/* ══ 렌더 ════════════════════════════════════ */
function applyView() {
  $('#node-layer').style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.k})`;
  $('#wire-layer').setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`);
  const el = $('#viewport');
  el.style.backgroundSize = (22 * view.k) + 'px ' + (22 * view.k) + 'px';
  el.style.backgroundPosition = view.x + 'px ' + view.y + 'px';
  $('#zoom-label').textContent = Math.round(view.k * 100) + '%';
}
function wirePath(x1, y1, x2, y2) {
  const dx = Math.max(34, Math.min(150, Math.abs(x2 - x1) * 0.5));
  return `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`;
}
const svgEl = t => document.createElementNS('http://www.w3.org/2000/svg', t);

function renderWires() {
  const g = graph();
  const layer = $('#wire-layer');
  const live = liveIds();
  layer.innerHTML = '';

  // 연산자 노드는 입력 순서가 의미를 가지므로 와이어에 번호를 붙인다.
  const ordinal = {};
  if (inFormat()) {
    for (const n of nodeList(g)) {
      if (!FOP_TYPES.includes(n.type)) continue;
      operands(g, n.id).forEach((k, i) => { ordinal[k.id + '>' + n.id] = i + 1; });
    }
  }

  for (const e of g.edges) {
    const a = g.nodes[e.from], b = g.nodes[e.to];
    if (!a || !b) continue;
    const pa = portPos(a), pb = portPos(b);
    const d = wirePath(pa.outX, pa.y, pb.inX, pb.y);
    const on = live.has(e.from) && live.has(e.to);
    const grp = svgEl('g');
    grp.setAttribute('class', 'wire-g');
    grp.style.pointerEvents = 'auto';
    // 삭제는 viewport 의 pointerdown 에서 처리한다. 팬이 포인터를 캡처해 버리면
    // click 이 viewport 로 되돌아가기 때문에 여기에 onclick 을 달면 안 걸린다.
    grp.dataset.from = e.from;
    grp.dataset.to = e.to;
    const hit = svgEl('path');
    hit.setAttribute('class', 'wire-hit'); hit.setAttribute('d', d);
    hit.innerHTML = '<title>클릭해서 연결 끊기</title>';
    const p = svgEl('path');
    p.setAttribute('class', 'wire' + (on ? '' : ' dead'));
    p.setAttribute('d', d);
    if (on) p.style.stroke = accentOf(a);
    grp.append(hit, p);

    const ord = ordinal[e.from + '>' + e.to];
    if (ord) {
      const t = svgEl('text');
      t.setAttribute('class', 'wire-ord');
      t.setAttribute('x', pb.inX - 16);
      t.setAttribute('y', pb.y - 6);
      t.setAttribute('text-anchor', 'end');
      t.textContent = ord;
      grp.append(t);
    }
    layer.append(grp);
  }

  if (ui.wire) {
    const p = svgEl('path');
    p.setAttribute('class', 'wire-temp');
    p.setAttribute('d', wirePath(ui.wire.x1, ui.wire.y1, ui.wire.x2, ui.wire.y2));
    layer.append(p);
  }
}

/* ── 파이프라인 옵션 행 ──────────────────── */
function triControl(n, o) {
  const cur = valuesOf(n)[o.id];
  const tri = document.createElement('div');
  tri.className = 'tri';
  const states = o.negation
    ? [['켜기', true, o.flag], ['끄기', false, o.negation]]
    : [['켜기', true, o.flag]];
  for (const [label, val, tip] of states) {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = label; b.title = tip;
    b.setAttribute('aria-pressed', String(cur === val));
    b.onclick = () => { valuesOf(n)[o.id] = val; render(); };
    tri.append(b);
  }
  return tri;
}

function optRow(n, o) {
  const row = document.createElement('div');
  row.className = 'row';
  row.dataset.opt = o.id;
  const top = document.createElement('div');
  top.className = 'row-top';
  top.innerHTML = `<span class="row-flag">${o.flag}`
    + (o.short ? ` <span class="short">${o.short}</span>` : '') + `</span>`;

  // -f 는 그 자체가 표현식이다. 서브그래프로 들어가는 문을 여기 단다.
  if (o.id === 'format') {
    const sub = document.createElement('button');
    sub.className = 'row-sub'; sub.type = 'button'; sub.textContent = '그래프 ↗';
    sub.title = '포맷 셀렉터를 노드 서브그래프로 편집한다';
    sub.onclick = ev => { ev.stopPropagation(); enterFormat(); };
    top.append(sub);
  }

  const x = document.createElement('button');
  x.className = 'row-x'; x.type = 'button'; x.textContent = '✕';
  x.title = '이 옵션 빼기';
  x.onclick = () => { delete valuesOf(n)[o.id]; render(); };
  top.append(x);
  row.append(top);

  if (o.help) {
    const h = document.createElement('div');
    h.className = 'row-help'; h.textContent = o.help; h.title = o.help;
    row.append(h);
  }

  const ctl = document.createElement('div');
  ctl.className = 'row-ctl';
  const cur = valuesOf(n)[o.id];

  if (o.kind === 'flag') {
    ctl.append(triControl(n, o));
  } else if (o.kind === 'choice') {
    const sel = document.createElement('select');
    sel.innerHTML = '<option value="">(기본)</option>'
      + o.choices.map(c => `<option${c === cur ? ' selected' : ''}>${c}</option>`).join('');
    sel.onchange = () => { valuesOf(n)[o.id] = sel.value; renderAfterEdit(); };
    ctl.append(sel);
  } else {
    const el = document.createElement(o.kind === 'repeatable' ? 'textarea' : 'input');
    if (o.kind !== 'repeatable') el.type = 'text';
    el.value = cur === undefined || cur === true || cur === false ? '' : cur;
    el.placeholder = o.kind === 'repeatable'
      ? (o.metavar || 'VALUE') + ' — 한 줄에 하나'
      : (o.metavar || (o.default != null ? String(o.default) : 'VALUE'));
    el.oninput = () => { valuesOf(n)[o.id] = el.value; renderAfterEdit(); };
    ctl.append(el);
  }
  row.append(ctl);

  row.onmouseenter = () => { ui.lit = o.id; paintLit(); };
  row.onmouseleave = () => { ui.lit = null; paintLit(); };
  return row;
}

function pickerList(n, q) {
  const vals = valuesOf(n);
  const pool = BY_STAGE[n.stage].filter(o => !(o.id in vals));
  return search(q, pool) || pool;
}
function renderPickerList(n, ul, q) {
  const hits = pickerList(n, q);
  ul.innerHTML = '';
  if (!hits.length) { ul.innerHTML = '<li class="none">남은 옵션이 없다.</li>'; return; }
  for (const o of hits.slice(0, 60)) {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = `<div class="pf">${o.flag}${o.short ? ' <span class="short">' + o.short + '</span>' : ''}</div>`
      + `<div class="ph">${escapeHtml(o.help)}</div>`;
    b.onclick = () => {
      valuesOf(n)[o.id] = o.kind === 'flag' ? true : '';
      ui.picker = null;
      render();
    };
    li.append(b);
    ul.append(li);
  }
}

/* ── 포맷 노드 본문 ──────────────────────── */
function filterRow(n, f, idx) {
  const type = FKEY_TYPE[f.key] || 'str';
  const exists = f.op === 'has' || f.op === 'hasnot';
  const row = document.createElement('div');
  row.className = 'filt-row' + (exists ? ' exists' : '');

  const key = document.createElement('select');
  key.innerHTML = FKEYS.map(([k, ko]) =>
    `<option value="${k}"${k === f.key ? ' selected' : ''}>${ko}</option>`).join('');
  key.title = '필터 필드';
  key.onchange = () => {
    f.key = key.value;
    const t = FKEY_TYPE[f.key];
    const allowed = (t === 'num' ? NUM_OPS : STR_OPS).map(o => o[0]);
    if (!allowed.includes(f.op) && !['has', 'hasnot'].includes(f.op)) f.op = allowed[0];
    render();
  };

  const op = document.createElement('select');
  const opts = [...(type === 'num' ? NUM_OPS : STR_OPS), ...EXIST_OPS];
  op.innerHTML = opts.map(([v, ko]) =>
    `<option value="${v}"${v === f.op ? ' selected' : ''}>${ko}</option>`).join('');
  op.title = '비교 연산';
  op.onchange = () => { f.op = op.value; render(); };

  row.append(key, op);

  if (!exists) {
    const val = document.createElement('input');
    val.type = 'text';
    val.value = f.value || '';
    val.placeholder = type === 'num' ? '1080' : 'mp4';
    val.oninput = () => { f.value = val.value; renderAfterEdit(); };

    // yt-dlp 의 '?' 는 필터마다 따로 붙는다 ([height<=?1080]). 노드가 아니라 행에 둔다.
    const q = document.createElement('label');
    q.className = 'filt-q';
    q.title = '이 필드 값을 모르는 포맷도 통과시킨다 (yt-dlp 의 ? 접미사)';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = !!f.loose;
    cb.onchange = () => { f.loose = cb.checked; render(); };
    q.append(cb, document.createTextNode('?'));

    row.append(val, q);
  }

  const del = document.createElement('button');
  del.className = 'row-x'; del.type = 'button'; del.textContent = '✕';
  del.title = '필터 빼기';
  del.onclick = () => { filtersOf(n).splice(idx, 1); render(); };
  row.append(del);
  return row;
}

function streamBody(n, body) {
  const wrap = document.createElement('div');
  wrap.className = 'fsel';

  const custom = !SEL_SET.has(n.sel);
  const sel = document.createElement('select');
  sel.innerHTML = SELECTORS.map(([g, items]) =>
    `<optgroup label="${g}">` + items.map(([v]) =>
      `<option value="${v}"${v === n.sel ? ' selected' : ''}>${v}</option>`).join('') + '</optgroup>'
  ).join('') + `<option value="__custom"${custom ? ' selected' : ''}>(직접 입력 — 포맷 ID·확장자)</option>`;
  sel.title = '셀렉터';
  sel.onchange = () => {
    n.sel = sel.value === '__custom' ? '' : sel.value;
    render();
  };
  wrap.append(sel);

  if (custom) {
    const inp = document.createElement('input');
    inp.type = 'text'; inp.spellcheck = false;
    inp.value = n.sel || '';
    inp.placeholder = '137 · mp4 · 248 …';
    inp.oninput = () => { n.sel = inp.value.trim(); renderAfterEdit(); };
    wrap.append(inp);
  } else {
    const why = document.createElement('div');
    why.className = 'why';
    why.textContent = SEL_HELP[n.sel] || '';
    wrap.append(why);
  }
  body.append(wrap);

  const box = document.createElement('div');
  box.className = 'filt';
  const head = document.createElement('div');
  head.className = 'filt-head';

  add.className = 'row-sub'; add.type = 'button'; add.textContent = '+ 필터';
  add.onclick = () => { filtersOf(n).push({ key:'height', op:'<=', value:'1080' }); render(); };
  head.append(add);
  box.append(head);

  filtersOf(n).forEach((f, i) => box.append(filterRow(n, f, i)));

  if (filtersOf(n).some(f => !['has', 'hasnot'].includes(f.op))) {
    box.insertAdjacentHTML('beforeend',
      '<div class="filt-loose"><b>?</b> = 이 값을 모르는 포맷도 통과</div>');
  }
  body.append(box);
}

function opBody(n, body) {
  const ins = opsOf(n.id);
  const box = document.createElement('div');
  box.className = 'ops';
  box.innerHTML = `<div>${FTYPE[n.type].blurb} · 입력은 <b>세로 위치 순서</b>다.</div>`;

      box.insertAdjacentHTML('beforeend',
        `<div class="warn">입력이 하나뿐이라 <code>${FTYPE[n.type].tag}</code> 는 그냥 통과된다.</div>`);
    }

  body.append(box);
}

function foutBody(n, body) {
  const note = document.createElement('div');

/* ── 노드 ────────────────────────────────── */
function headLabel(n) {
  if (n.type === 'stage')
    return `<span class="node-tag">[${n.stage}]</span><span class="node-ko">${STAGE[n.stage].label}<span class="node-badge">우회</span></span>`;
  if (n.id === 'src')
    return `<span class="node-tag">[source]</span><span class="node-ko">소스<span class="node-badge">끊김</span></span>`;
  if (n.id === 'out')
    return `<span class="node-tag">[command]</span><span class="node-ko">명령어<span class="node-badge">끊김</span></span>`;
  const f = FTYPE[n.type];
  return `<span class="node-tag">[${f.tag}]</span><span class="node-ko">${f.label}<span class="node-badge">끊김</span></span>`;
}

function nodeEl(n, live) {
  const isIO = n.type === 'source' || n.type === 'sink' || n.type === 'fout';
  const el = document.createElement('div');
  el.className = 'node' + (isIO ? ' io' : '')
    + (live.has(n.id) ? '' : ' bypass') + (ui.sel === n.id ? ' sel' : '')
    + (n.collapsed ? ' collapsed' : '');
  el.dataset.id = n.id;
  el.style.setProperty('--a', accentOf(n));
  el.style.left = n.x + 'px';
  el.style.top = n.y + 'px';

  const head = document.createElement('div');
  head.className = 'node-head';
  head.innerHTML = headLabel(n) + `<span class="node-n" data-n="${setCount(n)}">${setCount(n)}</span>`;

  const toggle = () => {
    n.collapsed = !n.collapsed;
    if (ui.picker && ui.picker.node === n.id) ui.picker = null;
    render();
  };
  const fold = document.createElement('button');
  fold.className = 'node-x'; fold.type = 'button';
  fold.textContent = n.collapsed ? '▸' : '▾';
  fold.title = n.collapsed ? '펴기' : '접기';
  fold.onclick = ev => { ev.stopPropagation(); toggle(); };
  head.append(fold);

  if (!PROTECTED.has(n.id)) {
    const x = document.createElement('button');
    x.className = 'node-x'; x.type = 'button'; x.textContent = '✕';
    x.title = '노드 지우기';
    x.onclick = ev => { ev.stopPropagation(); dropNode(n.id); render(); };
    head.append(x);
  } else {
    head.append(document.createElement('span'));
  }
  head.title = n.type === 'stage' ? STAGE[n.stage].blurb
             : FTYPE[n.type] ? FTYPE[n.type].blurb : '';
  head.ondblclick = toggle;
  el.append(head);

  const body = document.createElement('div');
  body.className = 'node-body';

  if (n.id === 'src') {
    const ta = document.createElement('textarea');
    ta.value = n.urls || '';
    ta.spellcheck = false;
    ta.placeholder = 'https://…  — 한 줄에 하나';
    ta.oninput = () => { n.urls = ta.value; renderAfterEdit(); };
    const note = document.createElement('div');
    note.className = 'node-note';
    note.textContent = '명령어 맨 뒤에 붙는 대상 URL.';
    body.append(ta, note);
  } else if (n.id === 'out') {
    const toks = tokensNow();
    const note = document.createElement('div');
    note.className = 'node-note';
    note.textContent = '여기까지 이어진 노드만 아래 명령어에 들어간다.';
    const stat = document.createElement('div');
    stat.className = 'sink-stat';
    stat.innerHTML = `<span>토큰 ${toks.length}</span>`
      + `<span>단계 ${new Set(toks.map(t => t.node)).size}</span>`
      + `<span>URL ${urlsNow().length}</span>`;
    body.append(note, stat);
  } else if (n.type === 'stream') {
    streamBody(n, body);
  } else if (FOP_TYPES.includes(n.type)) {
    opBody(n, body);
  } else if (n.type === 'fout') {
    foutBody(n, body);
  } else {
    const vals = valuesOf(n);
    const rows = BY_STAGE[n.stage].filter(o => o.id in vals);
    if (!rows.length) {
      const note = document.createElement('div');
      note.className = 'node-note';
      note.textContent = STAGE[n.stage].blurb + ' — 아직 고른 옵션이 없다.';
      body.append(note);
    }
    for (const o of rows) body.append(optRow(n, o));

    if (ui.picker && ui.picker.node === n.id) {
      const box = document.createElement('div');
      box.className = 'picker';
      const inp = document.createElement('input');
      inp.type = 'text'; inp.spellcheck = false;
      inp.placeholder = STAGE[n.stage].label + ' 옵션 검색…';
      inp.value = ui.picker.q;
      const ul = document.createElement('ul');
      inp.oninput = () => { ui.picker.q = inp.value; renderPickerList(n, ul, inp.value); };
      inp.onkeydown = ev => { if (ev.key === 'Escape') { ev.stopPropagation(); ui.picker = null; render(); } };
      box.append(inp, ul);
      body.append(box);
      renderPickerList(n, ul, ui.picker.q);
      queueMicrotask(() => inp.focus());
    } else {
      const add = document.createElement('button');
      add.className = 'add'; add.type = 'button'; add.textContent = '+ 옵션';
      add.onclick = () => { ui.picker = { node:n.id, q:'' }; render(); };
      body.append(add);
    }
  }
  if (!n.collapsed) el.append(body);

  if (hasInPort(n)) {
    const pin = document.createElement('span');
    pin.className = 'port in'; pin.dataset.node = n.id; pin.dataset.side = 'in';
    pin.title = '입력';
    el.append(pin);
  }
  if (hasOutPort(n)) {
    const pout = document.createElement('span');
    pout.className = 'port out'; pout.dataset.node = n.id; pout.dataset.side = 'out';
    pout.title = '출력 — 여기서 끌어다 다른 노드 입력에 놓아라';
    el.append(pout);
  }

  el.onpointerdown = () => { ui.sel = n.id; paintSel(); };
  return el;
}

    : '캔버스로 끌어다 놓거나 클릭해서 노드를 만든다. 소스에서 명령어까지 <b>이어진 노드만</b> 결과에 들어간다.';

function escapeHtml(t) {
  return String(t).replace(/[&<>]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c]));
}
function highlight(text, terms) {
  let html = escapeHtml(text);
  for (const t of terms) {
    if (!t) continue;
    html = html.replace(new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'), '<mark>$1</mark>');
  }
  return html;
}

function renderHits() {
  const box = $('#hits');
  const q = $('#q').value;
  const hits = inFormat() ? null : search(q);
  if (!hits) { box.hidden = true; box.innerHTML = ''; return; }
  const terms = q.trim().toLowerCase().split(/\s+/).filter(Boolean).flatMap(expand);
  box.hidden = false;
  box.innerHTML = `<div class="hits-head">${hits.length}개 일치 · 고르면 해당 단계 노드에 들어간다</div>`;
  for (const o of hits.slice(0, 80)) {
    const holder = stageOf(o.stage);
    const on = holder && o.id in valuesOf(holder);
    const b = document.createElement('button');
    b.className = 'hit'; b.type = 'button';
    b.innerHTML = `<span><span class="hit-flag">${highlight(o.flag, terms)}`
      + (o.short ? ` <span class="short">${o.short}</span>` : '') + `</span>`
      + `<span class="hit-help">${highlight(o.help, terms)}</span></span>`
      + (on ? `<span class="hit-on">✓ 배치됨</span>`
            : `<span class="hit-stage" style="color:${ACCENT[o.stage]}">${o.stage}</span>`);
    b.onclick = () => {
      const n = addStageNode(o.stage, ...centerSpot());
      valuesOf(n)[o.id] = o.kind === 'flag' ? true : '';
      $('#q').value = ''; renderHits();
      render();
      focusNode(n.id);
    };
    box.append(b);
  }
}

function renderCmd() {
  const box = $('#cmd');
  const toks = tokensNow();
  box.innerHTML = '';
  box.append(Object.assign(document.createElement('span'), { className:'prompt', textContent:'$ ' }));
  box.append(Object.assign(document.createElement('span'), { textContent:'yt-dlp' }));
  for (const t of toks) {
    box.append(document.createTextNode(' '));
    const el = document.createElement('span');
    el.className = 'tok' + (ui.lit === t.opt.id ? ' lit' : '');
    el.dataset.opt = t.opt.id;
    el.dataset.node = t.node;
    el.textContent = t.text;
    el.title = t.opt.flag + ' — [' + t.opt.stage + '] ' + STAGE[t.opt.stage].label + ' 노드';
    box.append(el);
  }
  for (const u of urlsNow()) {
    box.append(document.createTextNode(' '));
    box.append(Object.assign(document.createElement('span'), { className:'tok url', textContent: quote(u) }));
  }

  const n = $('#notes');
  const parts = [];
  if (ui.unknown.length) parts.push('<b>읽지 못한 토큰:</b> ' + ui.unknown.map(escapeHtml).join(' · '));
  if (ui.fmtWarn) parts.push('<b>' + escapeHtml(ui.fmtWarn) + '</b>');

  if (inFormat()) {
    const issues = fmtIssues();
    parts.push(issues.length
      ? '<b>서브그래프:</b> ' + issues.map(escapeHtml).join(' · ')
      : '포맷 서브그래프 편집 중 · -f 값은 그래프가 컴파일한 결과로 계속 덮어쓴다');
  } else {
    const live = liveIds();
    const bypassed = nodeList(state).filter(x => x.type === 'stage' && !live.has(x.id));
    if (toks.length) {
      parts.push(toks.length + '개 옵션 · ' + new Set(toks.map(t => t.node)).size + '개 노드 · 플래그 순서는 그래프 순서를 따른다');
    } else if (!ui.unknown.length) {
      parts.push('아직 잡힌 옵션이 없다. 왼쪽 단계를 캔버스에 놓고 소스 → 명령어로 이어라.');
    }
    if (bypassed.length) {
      parts.push('<b>우회 중:</b> ' + bypassed.map(x => '[' + x.stage + ']').join(' ') + ' — 경로에서 끊겨 있어 반영되지 않는다');
    }
  }
  n.innerHTML = parts.join(' · ');
}

function paintLit() {

    el.classList.toggle('sel', el.dataset.id === ui.sel);

/** 텍스트 입력 중에는 노드를 다시 그리지 않는다 — 포커스가 날아간다. */
function renderAfterEdit() {
  if (inFormat()) {
    syncFormatValue();

    if (e) e.textContent = fmtExpr();

  }
