<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ytstudio — 플레이그라운드</title>
    <meta name="description" content="yt-dlp 명령어를 코드로 짓고 그 자리에서 검사한다. 설치 없이." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🎬</text></svg>" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header class="top">
      <h1>ytstudio</h1>
      <p class="tag">
        yt-dlp 명령어를 코드로 짓고, 그 자리에서 <strong>설치된 실물에 대조해</strong> 검사한다.
      </p>
      <p class="meta" id="meta"></p>
      <nav class="links">
        <a href="https://github.com/cbcruk/yt-studio">GitHub</a>
        <a href="https://www.npmjs.com/package/ytstudio">npm</a>
      </nav>
    </header>

    <nav class="tabs" id="tabs" aria-label="예제"></nav>
    <p class="note" id="note"></p>

    <main class="split">
      <section class="pane">
        <h2 class="pane-h">
          코드
          <span class="hint"><kbd>Ctrl</kbd>+<kbd>Space</kbd> 로 자동완성</span>
        </h2>
        <div id="editor" class="editor"></div>
        <ul class="diags" id="diags" hidden></ul>
      </section>

      <section class="pane">
        <h2 class="pane-h">
          명령어
          <button id="copy" class="copy" type="button">복사</button>
        </h2>
        <pre class="command" id="command"><code></code></pre>

        <h2 class="pane-h">검사 <span class="hint" id="verdict"></span></h2>
        <ul class="issues" id="issues"></ul>

        <h2 class="pane-h">설명</h2>
        <ul class="explain" id="explain"></ul>

        <h2 class="pane-h">만들 파일</h2>
        <p class="file" id="file"></p>
      </section>
    </main>

    <footer class="foot">
      <p>
        이 페이지에서 도는 것은 <code>ytstudio/browser</code> 그 자체다. 자동완성은 패키지가
        배포하는 <code>.d.ts</code> 를 브라우저 안 타입스크립트에 그대로 먹여서 나온다 —
        데모용으로 따로 적어 둔 목록이 아니다.
      </p>
      <p>코드는 이 브라우저 안에서만 돈다. 서버로 보내지 않는다.</p>
    </footer>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
