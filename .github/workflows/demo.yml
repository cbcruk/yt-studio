# 플레이그라운드 — 짓고, 브라우저로 확인하고, main 이면 Pages 에 올린다.
#
# 검사 워크플로와 따로 두는 이유는 monaco 때문이다. 데모 하나 때문에 95MB 를
# 받는데, 그걸 본체 검사에 얹으면 라이브러리만 고친 PR 도 그 값을 낸다.
#
# 그래도 PR 마다 돌기는 해야 한다. 이 페이지는 저장소가 만들어 낸 `.d.ts` 와
# 스키마를 그대로 먹으므로 **src/ 를 고치면 데모가 깨질 수 있다** — 배포할 때
# 알게 되면 늦다.
name: 데모

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # GitHub Pages 는 /<repo>/ 아래에 올라간다. 빌드가 이걸 자산 경로에 박으므로
    # **확인도 같은 자리에서** 해야 한다 — 루트에 놓고 보면 자산이 전부 404 인
    # 페이지를 검사하게 된다. 그래서 잡 전체에 건다.
    env:
      DEMO_BASE: /${{ github.event.repository.name }}/

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-demo-${{ runner.os }}-${{ hashFiles('bun.lock', 'demo/bun.lock') }}
          restore-keys: bun-demo-${{ runner.os }}-

      # 데모가 읽는 것이 `lib/**/*.d.ts` 라서 라이브러리를 먼저 짓는다.
      # 손으로 옮겨 적은 사본이 없다는 것이 이 데모의 요점이다.
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build

      - name: 데모 의존성
        working-directory: demo
        run: bun install --frozen-lockfile

      # 데모도 타입을 본다. 라이브러리의 `.d.ts` 를 그대로 상대하므로
      # 공개 API 를 고치면 여기서 먼저 걸린다.
      - name: 타입
        working-directory: demo
        run: bun run check

      # playwright 가 **자기 버전에 맞는** 크로미움을 꺼내 온다. 러너에 깔린
      # 크롬을 쓰면 리비전이 어긋나 조용히 다른 것을 띄운다.
      - name: 크로미움
        working-directory: demo
        run: bunx playwright install --with-deps chromium

      - name: 빌드
        working-directory: demo
        run: bun run build

      # 이 페이지의 약속은 브라우저 안에서만 확인된다 — 배포하는 `.d.ts` 로
      # 자동완성이 뜨는가, 손님 코드가 명령어까지 가는가.
      - name: 브라우저 확인
        working-directory: demo
        run: bun smoke.ts

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: demo/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
