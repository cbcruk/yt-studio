# Playground — build it, check it in a browser, and deploy to Pages on main.
#
# It's kept separate from the test workflow because of monaco. The demo alone
# pulls 95MB, and adding that to the main checks would make even library-only
# PRs pay for it.
#
# It still has to run on every PR. This page consumes the `.d.ts` and schema the
# repo produces as is, so **changing src/ can break the demo** — finding out at
# deploy time is too late.
name: Demo

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # GitHub Pages serves under /<repo>/. The build bakes this into asset paths, so
    # **checking must happen at the same place** — served from the root, we'd be
    # checking a page whose assets all 404. So it's set for the whole job.
    env:
      DEMO_BASE: /${{ github.event.repository.name }}/

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-demo-${{ runner.os }}-${{ hashFiles('bun.lock', 'demo/bun.lock') }}
          restore-keys: bun-demo-${{ runner.os }}-

      # The demo reads `lib/**/*.d.ts`, so the library is built first.
      # Having no hand-copied duplicate is the whole point of this demo.
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build

      - name: Demo dependencies
        working-directory: demo
        run: bun install --frozen-lockfile

      # The demo type-checks too. It works directly against the library's `.d.ts`,
      # so changes to the public API are caught here first.
      - name: Types
        working-directory: demo
        run: bun run check

      # playwright fetches the Chromium **matching its own version**. Using the
      # Chrome installed on the runner would mismatch revisions and silently launch
      # something else.
      - name: Chromium
        working-directory: demo
        run: bunx playwright install --with-deps chromium

      - name: Build
        working-directory: demo
        run: bun run build

      # This page's promise can only be verified inside a browser — does
      # autocomplete appear from the shipped `.d.ts`, and does users' code get all
      # the way to a command.
      - name: Browser check
        working-directory: demo
        run: bun smoke.ts

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: demo/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
