# npm test 와 같은 것을 돌린다. 단계를 쪼갠 건 실패를 한눈에 가르기 위해서다 —
# 타입이 깨진 건지, 단위가 깨진 건지, CLI 가 깨진 건지 잡 요약에서 바로 보인다.
#
# 예전에는 bun 을 devDependency 로 두고 npm ci 로 깔았는데, 그러면 매 실행마다
# bun 바이너리를 통째로 설치한다 — node_modules 가 380MB 였고 그중 347MB 가
# bun 이었다. setup-bun 이 실행 파일을 자기 캐시에서 꺼내 주므로 그 값을 안 낸다.
name: 테스트

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # setup-node 는 안 쓴다. 배포물이 `#!/usr/bin/env node` 짜리라 CLI 검사에
      # 노드가 필요한 건 맞는데, ubuntu-24.04 이미지가 22.23.1 을 이미 PATH 에
      # 두고 있다 — setup-node 로 '22' 를 골라도 같은 것이 나온다. 액션 하나에
      # 1초를 내고 있었다.
      #
      # 대신 검사 버전이 이미지를 따라간다. engines 는 >=22 이므로 이미지가
      # 24 로 올라가면 바닥(22)은 아무도 안 밟게 된다. 그때 필요한 건 핀 하나가
      # 아니라 매트릭스(22 + 24)다 — 핀은 손님 대다수가 쓰는 쪽을 오히려 안 본다.
      - name: 노드
        run: node --version

      # 버전은 package.json 의 packageManager 필드가 고정한다.
      - uses: oven-sh/setup-bun@v2

      # setup-bun 이 캐싱하는 건 bun 실행 파일뿐이라 의존성은 따로 잡아 준다.
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # --ignore-scripts 로 prepare 를 막는다. prepare 는 tsc 를 부르는데
      # 아래에서 어차피 한 번 짓는다 — 두 번 지을 이유가 없다.
      - run: bun install --frozen-lockfile --ignore-scripts

      # 옵션 타입은 스키마에서 나온다. 스키마만 고치고 다시 안 뽑으면
      # 자동완성이 설치된 yt-dlp 와 어긋난다 — 그게 이 층의 유일한 약속이다.
      - name: 옵션 타입이 스키마와 맞는가
        run: |
          bun run gen:types
          if ! git diff --quiet -- src/core/options.gen.ts; then
            echo "::error::options.gen.ts 가 ytstudio.schema.json 과 다르다 — 'npm run gen:types' 를 돌리고 같이 커밋할 것"
            git diff --stat -- src/core/options.gen.ts
            exit 1
          fi

      # 소스·테스트·생성기 전부를 본다. 예전에 eslint 가 보던 것(선언 안 된 이름,
      # 죽은 지역 변수)도 여기 들어왔다. 그리고 tests/types/reject.ts 의
      # @ts-expect-error 가 양쪽으로 문다 — 막을 건 막고 통과시킬 건 통과시킨다.
      - name: 타입
        run: bun run check:types

      # 아래 검사 둘이 컴파일한 lib/ 를 상대한다. 여기서 한 번만 짓는다.
      - name: 빌드
        run: bun run build

      # bun 이 소스를 그대로 읽는다 — 빌드를 안 거친다.
      - name: 단위
        run: bun run test:unit

      # 이쪽은 반대로 컴파일한 lib/ 를 노드로 띄운다. 배포하는 물건이 그거다.
      - name: CLI
        run: bun run test:cli

      # ytstudio types 는 손님 프로젝트에 파일을 쓴다. 그래서 임시 프로젝트를
      # 세우고, 만들어진 .d.ts 를 진짜 tsc 로 컴파일해 본다. yt-dlp 는 안
      # 깔아도 된다 — 이 명령이 보는 건 --version 과 --help 출력뿐이라
      # 붙박이 도움말을 뱉는 껍데기가 곧 실물이다.
      - name: types 명령
        run: bun run test:types
