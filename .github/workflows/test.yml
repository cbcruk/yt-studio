# npm test 와 같은 것을 돌린다. 단계를 쪼갠 건 실패를 한눈에 가르기 위해서다 —
# 타입이 깨진 건지, 단위가 깨진 건지, CLI 가 깨진 건지 잡 요약에서 바로 보인다.
name: 테스트

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # node --test 의 글로브(`tests/unit/*.test.mjs`)는 21 이상에서만 된다.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: 린트
        run: npm run lint

      # 옵션 타입은 schema.json 에서 나온다. 스키마만 고치고 다시 안 뽑으면
      # 자동완성이 설치된 yt-dlp 와 어긋난다 — 그게 이 층의 유일한 약속이다.
      - name: 옵션 타입이 스키마와 맞는가
        run: |
          node gen_options.mjs
          if ! git diff --quiet -- src/core/options.gen.ts; then
            echo "::error::options.gen.ts 가 schema.json 과 다르다 — 'npm run gen:types' 를 돌리고 같이 커밋할 것"
            git diff --stat -- src/core/options.gen.ts
            exit 1
          fi

      # 막아야 할 것을 막고, 통과시킬 것은 통과시키는가 (@ts-expect-error 가 양쪽으로 문다)
      - name: 타입
        run: npm run check:types

      - name: 단위
        run: npm run test:unit

      # 종료 코드와 파이프까지 본다 — 진짜 프로세스를 띄운다.
      - name: CLI
        run: npm run test:cli
