# Runs the same thing as `bun run test`. The steps are split so failures can be
# told apart at a glance — whether types, unit, or CLI broke is visible right in
# the job summary.
#
# This repo can't run anything without bun. bun used to be a devDependency and
# get installed, which meant installing the whole bun binary on every run —
# node_modules was 380MB, 347MB of it bun. setup-bun pulls the executable from its
# own cache, so we don't pay that.
name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # setup-node isn't used. The shipped artifact is `#!/usr/bin/env node`, so the
      # CLI checks do need Node, but the ubuntu-24.04 image already has 22.23.1 on
      # PATH — picking '22' with setup-node yields the same thing. It was costing a
      # second per action.
      #
      # In exchange, the tested version follows the image. engines is >=22, so once
      # the image moves to 24 nobody exercises the floor (22). What's needed then is
      # a matrix (22 + 24), not a pin — a pin would skip what most users run.
      - name: Node
        run: node --version

      # The version is pinned by the packageManager field in package.json.
      - uses: oven-sh/setup-bun@v2

      # setup-bun caches only the bun executable, so dependencies are cached separately.
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # --ignore-scripts blocks prepare. prepare calls tsc, and we build once below
      # anyway — no reason to build twice.
      - run: bun install --frozen-lockfile --ignore-scripts

      # Option types come from the schema. Changing only the schema without
      # regenerating makes autocomplete drift from the installed yt-dlp — the one
      # promise of this layer.
      - name: Option types match schema
        run: |
          bun run gen:types
          if ! git diff --quiet -- src/core/options.gen.ts; then
            echo "::error::options.gen.ts differs from ytstudio.schema.json — run 'bun run gen:types' and commit it together"
            git diff --stat -- src/core/options.gen.ts
            exit 1
          fi

      # Covers source, tests, and generators. What eslint used to check (undeclared
      # names, dead locals) moved in here too. And the @ts-expect-error in
      # tests/types/reject.ts bites both ways — block what must be blocked, pass what must pass.
      - name: Types
        run: bun run check:types

      # The two checks below run against the compiled lib/. Build it once, here.
      - name: Build
        run: bun run build

      # bun reads the source directly — no build needed.
      - name: Unit
        run: bun run test:unit

      # This one, conversely, launches the compiled lib/ with Node. That's what ships.
      - name: CLI
        run: bun run test:cli

      # ytstudio types writes files into users' projects. So it sets up a temporary
      # project and compiles the generated .d.ts with real tsc. yt-dlp needn't be
      # installed — this command only looks at --version and --help output, so a
      # shell that prints canned help is the real thing.
      - name: types command
        run: bun run test:types

      # What users see in their editor is the .d.ts in lib/. Checks that every public
      # declaration has JSDoc and that each @example compiles as is in a users'
      # project. The rules live in .claude/rules/jsdoc.md.
      - name: Docs
        run: bun run test:docs

      # Looks at the tarball that ships to users. Mis-editing files or exports stays
      # fine inside the repo but breaks on install — tests can't catch that.
      - name: Package
        run: |
          npm pack --pack-destination /tmp
          npx --yes publint /tmp/ytstudio-*.tgz
