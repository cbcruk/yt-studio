# Checks whether we've drifted from the real yt-dlp.
#
# test.yml runs only inside the committed snapshot — deterministic, and it says
# exactly what my change broke. In exchange it can't see changes coming from
# outside. This job covers that side.
#
# Not run on every PR. If a yt-dlp release turns someone else's PR red, that is
# an interruption, not a notification. It runs on a schedule and tells us.
name: Drift

on:
  schedule:
    # Daily at 06:00 KST (21:00 UTC)
    - cron: '0 21 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Node comes from the image (same reason as test.yml).
      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile --ignore-scripts

      # gen_schema.py loads yt-dlp **as a Python module** to read the optparse tree.
      # That is this job's answer key, so it has to be installed with pip — the
      # standalone binary can't be imported.
      - name: Real yt-dlp
        run: |
          pip install --quiet --upgrade yt-dlp
          yt-dlp --version

      - name: Build
        run: bun run build

      # It fails only when the machinery is broken — the help parser can't read the
      # current format, gen_schema.py won't run, or yt-studio types can't finish
      # against the real thing. The committed schema being older than latest is
      # always the case, so that's reported only as a notice.
      - name: Compare
        run: bun run test:drift
