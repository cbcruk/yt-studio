# Publishes to npm.
#
# The flow — run `npm version <patch|minor|major>` by hand, which bumps
# package.json and creates a tag like `v0.1.1` along with it. Pushing that runs
# this job.
#
#     npm version minor && git push --follow-tags
#
# Only the first publish was done by hand. It involved claiming the name and
# checking the npm page, and building the pipeline first then getting stuck there
# would double the debugging.
#
# provenance is attached — npm certifies "this tarball was built by this workflow
# at this commit". It's free only when publishing from Actions, so there's no
# reason not to use it.
name: Publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      # Needed for provenance signing. Passing --provenance without it fails.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # npm publish has to be done with npm, so we need a Node with registry config.
      # Checks and the build are still run by bun.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile --ignore-scripts

      # Stops here if the version the tag points to and package.json disagree.
      # Catches pushing a tag by hand without using `npm version`.
      - name: Tag matches version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag differs from package.json $pkg — bump with 'npm version'"
            exit 1
          fi
          echo "v$pkg"

      # prepublishOnly reruns bun run test, so it isn't run here.
      # That hook's purpose is to leave no path to publishing without checks.
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
