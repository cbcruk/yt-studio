# npm 에 발행한다.
#
# 흐름은 이렇다 — 손으로 `npm version <patch|minor|major>` 를 치면 package.json
# 이 올라가고 `v0.1.1` 같은 태그가 같이 생긴다. 그걸 밀면 이 잡이 돈다.
#
#     npm version minor && git push --follow-tags
#
# 첫 발행만 손으로 했다. 이름 선점과 npm 페이지 확인이 걸려 있어서, 파이프라인을
# 먼저 세워 두고 거기서 막히면 디버깅이 배로 든다.
#
# provenance 를 붙인다 — "이 tarball 은 이 커밋의 이 워크플로가 만들었다"를 npm
# 이 증명한다. Actions 에서 발행할 때만 공짜로 되는 것이라 안 쓸 이유가 없다.
name: 발행

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      # provenance 서명에 필요하다. 이거 없이 --provenance 를 주면 실패한다.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # npm publish 를 npm 으로 해야 하므로 레지스트리 설정이 붙은 노드가 필요하다.
      # 검사와 빌드는 여전히 bun 이 돌린다.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile --ignore-scripts

      # 태그가 가리키는 버전과 package.json 이 어긋나면 여기서 멈춘다.
      # `npm version` 을 안 쓰고 태그만 손으로 밀었을 때 걸린다.
      - name: 태그와 버전이 맞는가
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::태그 v$tag 와 package.json $pkg 이 다르다 — 'npm version' 으로 올릴 것"
            exit 1
          fi
          echo "v$pkg"

      # prepublishOnly 가 bun run test 를 다시 돌리므로 여기서는 안 돌린다.
      # 검사 없이 발행되는 길을 하나도 안 남기는 게 그 훅의 목적이다.
      - name: 발행
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
