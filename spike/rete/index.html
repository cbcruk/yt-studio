<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>스파이크 · Rete + lit 파이프라인 캔버스</title>
</head>
<body>

<header class="top">
  <div>
    <div class="wordmark">Rete <em>스파이크</em></div>
    <div class="ver" id="ver"></div>
  </div>
  <div class="top-spacer"></div>
  <div class="topact">
    <button class="btn" id="add">+ format 단계</button>
    <button class="btn" id="fit">화면 맞춤</button>
  </div>
</header>

<div class="main">
  <aside class="palette">
    <div class="pal-head">스파이크가 확인하는 것</div>
    <div class="pal-hint" id="report"></div>
  </aside>
  <div class="viewport" id="viewport"></div>
</div>

<footer class="readout">
  <div class="readout-bar"><h2>조립 결과</h2></div>
  <div class="cmd" id="cmd"></div>
  <div class="notes" id="notes"></div>
</footer>

<script type="module" src="./main.js"></script>
</body>
</html>
