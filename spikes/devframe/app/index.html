<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ytstudio devframe</title>
    <style>
      body { font: 14px/1.5 ui-sans-serif, system-ui; margin: 24px; max-width: 880px; }
      textarea { width: 100%; font: 13px ui-monospace, monospace; padding: 8px; box-sizing: border-box; }
      pre { background: #8881; padding: 8px; overflow-x: auto; }
      .error { color: #d33; } .warn { color: #b80; } .info { opacity: .6; }
      small { opacity: .6; }
    </style>
  </head>
  <body>
    <h1>ytstudio <small id="source"></small></h1>
    <textarea id="cmd" rows="3">yt-dlp -f "bv+ba/" --write-sub -o "%(title)s" https://youtu.be/abc</textarea>
    <p id="file"></p>
    <ul id="issues"></ul>
    <details open><summary>explain</summary><pre id="explain"></pre></details>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
